version: '3.8'

services:
  postgres:
    image: postgres:17.6
    container_name: product-postgres
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d product_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  product-service:
    image: openjdk:22-slim
    container_name: product-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: product_db
      DATABASE_USERNAME: store
      DATABASE_PASSWORD: store123
      DATABASE_URL: jdbc:postgresql://postgres:5432/product_db
    ports:
      - "8080:8080"
    volumes:
      - ./target/product-service-1.0.0.jar:/app/product-service.jar
    working_dir: /app
    command: java -jar product-service.jar

volumes:
  postgres-data: